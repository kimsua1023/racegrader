name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-build:
    name: CLI build & vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...

  license-check:
    name: License check (cli 의존성)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install github.com/google/go-licenses@latest
      - run: go-licenses check ./... --disallowed_types=forbidden,restricted --ignore=racegrader/cli

  kernel-build:
    name: Kernel build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kernel
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-riscv64-unknown-elf
      - name: CHAOS=1
        run: make CPUS=2 CHAOS=1 SEED=1
      - name: CHAOS=0
        run: make CPUS=2 CHAOS=0
